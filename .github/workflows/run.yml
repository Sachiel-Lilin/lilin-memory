name: Lilin Auto Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # 1時間ごとに自動実行

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run main script
        run: |
          python main.py
